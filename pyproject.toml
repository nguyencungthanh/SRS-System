[project]
name = "smart-elevator"
version = "0.1.0"
description = "Smart Elevator System simulator (SRS v1.1)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "fake_ok: contract test that the fakes can also pass; run them with `pytest --fakes`",
]
