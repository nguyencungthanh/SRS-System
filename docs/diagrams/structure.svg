<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830" role="img" aria-labelledby="title desc">
<title id="title">Smart Elevator repository structure</title>
<desc id="desc">Docs and rules on top; the shared foundation agreed and frozen first; three modules built independently by Thanh, Hai and Huy; running, tuning and the demo; the test suite covering all 89 SRS requirement IDs; then the new wear-leveling non-functional requirement and a full re-test.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .group { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
  .label { fill: #1f2328; }
  .legend { fill: #57606a; }
  .arr, .head { stroke: #6e7781; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .teal rect { fill: #085041; stroke: #5DCAA5; }
    .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
    .coral rect { fill: #712B13; stroke: #F0997B; }
    .coral .th { fill: #FAECE7; } .coral .ts { fill: #F5C4B3; }
    .gray rect { fill: #444441; stroke: #B4B2A9; }
    .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
    .group { stroke: #6e7681; }
    .label { fill: #e6edf3; }
    .legend { fill: #9da7b3; }
    .arr, .head { stroke: #8b949e; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>

<rect class="bg" x="0.5" y="0.5" width="679" height="829" rx="12" stroke-width="1"/>

<g class="gray">
  <rect x="40" y="30" width="600" height="64" rx="8" stroke-width="0.8"/>
  <text class="th" x="340" y="55" text-anchor="middle">Docs and rules</text>
  <text class="ts" x="340" y="77" text-anchor="middle">README · PROJECT_PLAN · CONTRIBUTING · DECISIONS · AI_CONTEXT · ai-log · SRS</text>
</g>

<rect class="group" x="40" y="110" width="600" height="110" rx="12" stroke-width="0.8"/>
<text class="th label" x="56" y="135">Foundation · agreed and frozen first</text>
<g class="teal"><rect x="56" y="146" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="119" y="168" text-anchor="middle">contracts/</text>
  <text class="ts" x="119" y="188" text-anchor="middle">30 messages</text></g>
<g class="teal"><rect x="203" y="146" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="266" y="168" text-anchor="middle">fakes/</text>
  <text class="ts" x="266" y="188" text-anchor="middle">Stand-ins</text></g>
<g class="teal"><rect x="350" y="146" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="413" y="168" text-anchor="middle">simulation/</text>
  <text class="ts" x="413" y="188" text-anchor="middle">Bus and engine</text></g>
<g class="teal"><rect x="497" y="146" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="560" y="168" text-anchor="middle">scenarios/</text>
  <text class="ts" x="560" y="188" text-anchor="middle">Test scenarios</text></g>

<rect class="group" x="40" y="236" width="600" height="110" rx="12" stroke-width="0.8"/>
<text class="th label" x="56" y="261">Modules · built independently, then merged</text>
<g class="purple"><rect x="56" y="272" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="144" y="294" text-anchor="middle">dispatch/</text>
  <text class="ts" x="144" y="314" text-anchor="middle">Thanh · picks the car</text></g>
<g class="purple"><rect x="252" y="272" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="340" y="294" text-anchor="middle">cabin/</text>
  <text class="ts" x="340" y="314" text-anchor="middle">Hai · moves safely</text></g>
<g class="purple"><rect x="448" y="272" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="536" y="294" text-anchor="middle">control_center/</text>
  <text class="ts" x="536" y="314" text-anchor="middle">Huy · + api/ and web/</text></g>

<rect class="group" x="40" y="362" width="600" height="110" rx="12" stroke-width="0.8"/>
<text class="th label" x="56" y="387">Running, tuning and demo</text>
<g class="teal"><rect x="56" y="398" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="144" y="420" text-anchor="middle">app/</text>
  <text class="ts" x="144" y="440" text-anchor="middle">Run, replay, record</text></g>
<g class="teal"><rect x="252" y="398" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="340" y="420" text-anchor="middle">optimization/</text>
  <text class="ts" x="340" y="440" text-anchor="middle">+ results/ · AT-06</text></g>
<g class="teal"><rect x="448" y="398" width="176" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="536" y="420" text-anchor="middle">web/demo/</text>
  <text class="ts" x="536" y="440" text-anchor="middle">Explainer demo</text></g>

<g class="gray">
  <rect x="40" y="488" width="600" height="64" rx="8" stroke-width="0.8"/>
  <text class="th" x="340" y="513" text-anchor="middle">tests/ · everyone</text>
  <text class="ts" x="340" y="535" text-anchor="middle">Contract exams, engine, per module, optimization · all 89 SRS requirement IDs</text>
</g>
<line class="arr" x1="340" y1="553" x2="340" y2="570" marker-end="url(#arrow)"/>

<rect class="group" x="40" y="572" width="600" height="110" rx="12" stroke-width="0.8"/>
<text class="th label" x="56" y="597">Non-functional requirement · wear leveling (new)</text>
<g class="coral"><rect x="56" y="608" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="119" y="630" text-anchor="middle">cabin/</text>
  <text class="ts" x="119" y="650" text-anchor="middle">Trip counter</text></g>
<g class="coral"><rect x="203" y="608" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="266" y="630" text-anchor="middle">dispatch/</text>
  <text class="ts" x="266" y="650" text-anchor="middle">Wear penalty</text></g>
<g class="coral"><rect x="350" y="608" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="413" y="630" text-anchor="middle">simulation/</text>
  <text class="ts" x="413" y="650" text-anchor="middle">Monthly check</text></g>
<g class="coral"><rect x="497" y="608" width="127" height="56" rx="8" stroke-width="0.8"/>
  <text class="th" x="560" y="630" text-anchor="middle">optimization/</text>
  <text class="ts" x="560" y="650" text-anchor="middle">Wear study</text></g>
<line class="arr" x1="340" y1="683" x2="340" y2="700" marker-end="url(#arrow)"/>

<g class="gray">
  <rect x="40" y="702" width="600" height="64" rx="8" stroke-width="0.8"/>
  <text class="th" x="340" y="727" text-anchor="middle">Re-test everything</text>
  <text class="ts" x="340" y="749" text-anchor="middle">671 tests pass · AT-01..AT-06 re-run · replay identical · demo re-recorded</text>
</g>

<g class="teal"><rect x="40" y="790" width="12" height="12" rx="2" stroke-width="0.8"/></g>
<text class="ts legend" x="58" y="800">Framework and tools</text>
<g class="purple"><rect x="196" y="790" width="12" height="12" rx="2" stroke-width="0.8"/></g>
<text class="ts legend" x="214" y="800">Module owners</text>
<g class="gray"><rect x="324" y="790" width="12" height="12" rx="2" stroke-width="0.8"/></g>
<text class="ts legend" x="342" y="800">Shared by the team</text>
<g class="coral"><rect x="474" y="790" width="12" height="12" rx="2" stroke-width="0.8"/></g>
<text class="ts legend" x="492" y="800">Non-functional requirement</text>
</svg>
